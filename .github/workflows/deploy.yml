name: 自动编译并发布到 GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 编译前端资源
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装项目依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 配置 GitHub Pages 路径
        id: pages
        uses: actions/configure-pages@v5

      - name: TypeScript 类型校验
        run: npm run lint

      - name: 构建 Vite 静态站点
        env:
          VITE_BASE_PATH: "${{ steps.pages.outputs.base_path }}/"
        run: npm run build

      - name: 补充静态托管辅助文件
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
